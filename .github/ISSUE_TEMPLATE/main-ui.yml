name: Main UI change
description: Change the top bar, the context bar, the canvas or a page
title: "UI: "
labels: ["main-ui"]
body:
  - type: textarea
    id: what
    attributes:
      label: What must change?
      description: Say where it is on the screen. A sketch or a screenshot helps.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files that will change (if you know)
      placeholder: src/components/board/top-bar.tsx
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ] It works with mouse and keyboard
        - [ ] `pnpm check` passes
