name: Bug
description: Something does not work
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1. Open the board
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Add a screenshot or the error from the browser console.
